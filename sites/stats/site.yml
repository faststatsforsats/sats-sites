# Fast Stats for Sats: bitcoin values in charts, with the numbers and sources behind them
key: stats
name: Fast Stats for Sats
short_name: Stats
domain: faststatsforsats.com
url: https://faststatsforsats.com
tagline: See what Bitcoin changes in everyday numbers.
description: Free Bitcoin charts and plain explanations. Explore sats values, price history, and a converter, with public sources and daily updates.
role: value

# This site publishes the shared data and chart files at /data/ and /charts/.
serves_data: true

# The live-numbers API (step 15). Pages read it with shared/static/live.js and fall back to the daily figures.
api_url: https://api.faststatsforsats.com

# The line under the wordmark on the sharing card (sites/stats/static/brand/og.png). After changing it, run
# python3 scripts/sharing_card.py stats to redraw the card.
sharing_card_line: "See what sats are worth today and how their value has changed"

# The weekly email's subscribe form goes here in step 25 (the home page shows it under "Get one surprising chart each week.")
newsletter_embed: ""

# Footer line required on every page (style guide, Compliance)
disclaimer: Not financial advice. Fast Stats for Sats is an information site.

# Sections that appear in the header nav once they have pages (slug: label)
sections:
  charts: Charts
  value: Value
  tools: Tools

# The search description of each section's list page (a list page has no Markdown file of its own)
section_descriptions:
  charts: "Free Bitcoin charts with plain explanations, source data, and daily updates. Compare prices, purchasing power, market sentiment, and the network."
  value: "Compare everyday US prices, gold, and new homes in bitcoin terms. See the dates, calculations, and public sources behind each figure."
  tools: "Convert money to sats and bitcoin, or sats back to money. Check amounts in 30 currencies using an hourly price feed."

# The search description of the page shown for an address that does not exist (its heading and sentence are shared
# by the three sites: shared/templates/404.html)
not_found_description: "The page could not be found. Return to Fast Stats for Sats to explore Bitcoin charts, values, and the sats converter."

# Pages the build generates from data/ (added to the nav once the data exists)
nav_generated:
  - label: Money in sats
    url: /sats/
  - label: Items in sats
    url: /items/
